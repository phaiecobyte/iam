# =========================================================
# Database
# =========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/iam
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =========================================================
# Flyway
# =========================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.table=flyway_schema_history

#=========================================================
#           MAIL DEV
#=========================================================
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.public-base-url=http://localhost:8080
app.mail.from=iam@localhost


#=========================================================
#           Oauth2 Resource Server
#=========================================================
app.jwt.private-key-location=file:certs/private.pem
app.jwt.public-key-location=file:certs/public.pem
app.jwt.issuer=iam;


#=========================================================
#                   swagger
#=========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true